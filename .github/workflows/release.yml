name: Release

# Publica en PyPI al empujar una etiqueta de versión (v*.*.*).
# La versión se lee de pyproject.toml: la etiqueta debe coincidir (p. ej. v2.2.0
# con version = "2.2.0"). Usa Trusted Publishing (OIDC): no hace falta ningún
# token ni secreto en el repo. Requiere configurar el publisher en PyPI una vez.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Tests, build y publicación en PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests antes de publicar
        run: python -m unittest discover tests -v
      - name: Construir paquetes (wheel + sdist)
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
