name: Tests del kit

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Suite (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ejecutar suite
        run: python -m unittest discover tests -v

  dogfood:
    name: Autoaplicación (el kit se gobierna a sí mismo)
    runs-on: ubuntu-latest
    env:
      # Las fachadas del proyecto temporal importan el paquete (ADR-001).
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fia-harness init en proyecto temporal
        run: python -m fia_harness.cli init -d _dogfood
      - name: Bootstrap + estado validado (--check)
        working-directory: _dogfood
        run: |
          python bootstrap.py
          python task_generator.py --check

  estado-harness:
    name: Estado del repo válido (dogfood --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar estado del propio repo (reglas de oro)
        run: python task_generator.py --check
