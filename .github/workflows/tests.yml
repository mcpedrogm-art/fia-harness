name: Tests del kit

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Suite (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ejecutar suite
        run: python -m unittest discover tests -v

  dogfood:
    name: Autoaplicación (el kit se gobierna a sí mismo)
    runs-on: ubuntu-latest
    env:
      # Las fachadas del proyecto temporal importan el paquete (ADR-001).
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fia-harness init en proyecto temporal
        run: python -m fia_harness.cli init -d _dogfood
      - name: Bootstrap + estado validado (--check)
        working-directory: _dogfood
        run: |
          python bootstrap.py
          python task_generator.py --check

  wheel:
    name: Wheel instalable (init de humo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Construir el wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Instalar el wheel en un venv limpio
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install dist/*.whl
      - name: init de humo (paquete instalado, no el repo)
        run: |
          /tmp/venv-wheel/bin/fia init -d /tmp/proyecto-wheel
          test -f /tmp/proyecto-wheel/docs/UI_ASSETS.json
          test -f /tmp/proyecto-wheel/docs/UI_RECIPES.md
          test -f /tmp/proyecto-wheel/docs/UI_UX_EXCLUSIVA.md
          test -f /tmp/proyecto-wheel/docs/TASK_TEMPLATE.md

  estado-harness:
    name: Estado del repo válido (dogfood fia verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # receipt verify necesita los commits históricos (ADR-009)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar estado, evidencia y procedencia del propio repo
        run: python -m fia_harness.cli verify -d governance --strict-receipts
